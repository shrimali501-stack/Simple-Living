<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30-Day Minimalism Guide — Sukara Living</title>

  <!-- Your favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/sl-favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/sl-favicon.png">
  <link rel="apple-touch-icon" href="/sl-favicon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #F7F3EE; font-family: 'DM Sans', sans-serif; }

    .guide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      background: rgba(247, 243, 238, 0.96);
      border-bottom: 1px solid #D8D0C4;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .guide-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #2C2C28;
      text-decoration: none;
    }
    .guide-download {
      padding: 10px 24px;
      background: #4A5E3E;
      color: #FDFCFA;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .2s;
    }
    .guide-download:hover { background: #2C2C28; }

    .pdf-wrapper {
      width: 100%;
      height: calc(100vh - 57px);
    }
    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header class="guide-header">
    <a href="https://www.sukaraliving.in" class="guide-logo">Sukara Living</a>
    <a href="/30-day-minimalism-guide.pdf" download class="guide-download">Download PDF</a>
  </header>

  <div class="pdf-wrapper">
    <iframe
      src="/30-day-minimalism-guide.pdf"
      title="30-Day Minimalism Guide by Sukara Living"
    ></iframe>
  </div>

</body>
</html>
